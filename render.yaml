services:
  - type: web
    name: bakery-mini
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bakery-db
          property: connectionString
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: OWNER_WHATSAPP_NUMBER
        sync: false
      - key: WHATSAPP_OWNER_TEMPLATE
        sync: false
      - key: WHATSAPP_CUSTOMER_TEMPLATE
        sync: false
      - key: ADMIN_PASSCODE
        sync: false

databases:
  - name: bakery-db
    plan: free
